<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كوزمتك</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #fff; padding: 15px; padding-bottom: 50px; direction: rtl; max-width: 500px; margin: auto; position: relative; }
        
        /* الهيدر العلوي */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #1e293b; border-radius: 12px; margin-bottom: 12px; border-bottom: 3px solid #0284c7; }
        .header h1 { color: #38bdf8; font-size: 18px; margin-bottom: 2px; }
        .header p { color: #94a3b8; font-size: 11px; }
        .cart-icon-btn { background: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .cart-badge { background: #ef4444; color: white; border-radius: 50%; padding: 2px 7px; font-size: 11px; }

        /* حقل البحث عن منتج */
        .search-container { margin-bottom: 12px; position: relative; display: flex; align-items: center; }
        .search-input { width: 100%; padding: 10px 14px; padding-left: 32px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 13px; outline: none; transition: border-color 0.2s; }
        .search-input:focus { border-color: #38bdf8; }
        .clear-search-btn { position: absolute; left: 10px; color: #94a3b8; font-size: 14px; cursor: pointer; display: none; user-select: none; transition: color 0.2s; }
        .clear-search-btn:hover { color: #fff; }

        /* شريط الأقسام الأفقي */
        .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 15px; scrollbar-width: none; }
        .category-tab { background: #1e293b; color: #cbd5e1; padding: 8px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid #334155; white-space: nowrap; }
        .category-tab.active { background: #0284c7; color: #fff; font-weight: bold; border-color: #38bdf8; }

        /* شبكة عرض المنتجات (Grid Layout) */
        #productsGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        
        /* كروت المنتجات */
        .product-card { background: #1e293b; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #334155; cursor: pointer; position: relative; }
        .img-box { width: 100%; height: 130px; border-radius: 8px; background: #0f172a; display: flex; align-items: center; justify-content: center; font-size: 36px; overflow: hidden; margin-bottom: 8px; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }

        .product-details { flex: 1; margin-bottom: 8px; }
        .brand-tag { font-size: 10px; background: #0284c7; color: white; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 3px; }
        .product-title { font-size: 13px; color: #fff; font-weight: bold; line-height: 1.3; }
        .product-price { font-size: 13px; color: #38bdf8; font-weight: bold; margin-top: 4px; }

        /* أزرار التحكم بالكمية (+ و -) */
        .qty-controls { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: #0f172a; padding: 4px 8px; border-radius: 8px; border: 1px solid #334155; }
        .btn-qty { width: 30px; height: 30px; border-radius: 6px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-plus { background: #22c55e; color: white; width: 100%; }
        .btn-minus { background: #ef4444; color: white; }
        .qty-number { font-size: 14px; font-weight: bold; min-width: 20px; text-align: center; color: #fff; }

        /* نظام الصفحات */
        .page { display: block; }
        .hidden { display: none !important; }
        
        /* صفحة تفاصيل المنتج والسلايدر */
        .detail-card { background: #1e293b; border-radius: 12px; padding: 15px; border: 1px solid #334155; }
        .detail-img-box { width: 100%; height: 320px; border-radius: 10px; background: #f5efe6; display: flex; align-items: center; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; scroll-behavior: smooth; }
        .detail-img-box::-webkit-scrollbar { display: none; }
        .detail-img-box img { flex: 0 0 100%; min-width: 100%; max-width: 100%; height: 100%; object-fit: contain; border-radius: 10px; scroll-snap-align: start; }
        
        /* أسهم التنقل للكمبيوتر والموبايل */
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(15, 23, 42, 0.75); color: #38bdf8; border: 1px solid #0284c7; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center; z-index: 10; user-select: none; transition: background 0.2s; }
        .slider-btn:hover { background: #0284c7; color: #fff; }
        .slider-btn.prev { right: 8px; }
        .slider-btn.next { left: 8px; }

        /* مؤشر وجود صور إضافية */
        .img-indicator { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.7); color: #38bdf8; padding: 2px 10px; border-radius: 20px; font-size: 11px; border: 1px solid #0284c7; pointer-events: none; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }

        .detail-desc-box { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; margin: 15px 0; color: #cbd5e1; font-size: 13px; line-height: 1.5; }
        .detail-desc-box h3 { color: #38bdf8; font-size: 14px; margin-bottom: 6px; }
        .detail-desc-box p { white-space: pre-line; }

        /* صفحة السلة وزر الرجوع */
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .btn-back { background: #881337; color: #ffffff; border: 1px solid #be123c; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; transition: background 0.2s; }
        .btn-back:hover { background: #9f1239; }

        .cart-item { background: #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .cart-item-title { font-size: 14px; color: #fff; font-weight: bold; }
        .cart-item-price { font-size: 12px; color: #38bdf8; margin-top: 2px; }

        .form-group { margin-top: 15px; }
        .form-label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 4px; }
        .form-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 13px; margin-bottom: 10px; outline: none; }
        .form-input:focus { border-color: #38bdf8; }
        
        .total-box { background: #1e293b; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #38bdf8; }
        .delivery-note { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 6px; padding: 6px 10px; background: #1e293b; border-radius: 6px; border: 1px dashed #334155; display: flex; align-items: center; justify-content: center; gap: 5px; }
        
        .btn-send-wa { width: 100%; padding: 14px; background: #22c55e; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 15px; }

        /* الفوتر الخفيف */
        .footer { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: #0f172a; text-align: center; padding: 6px 0; color: #64748b; font-size: 10px; border-top: 1px solid #1e293b; z-index: 100; direction: ltr; }
    </style>
</head>
<body>

<!-- ================= صفحة المنتجات الرئيسية ================= -->
<div id="shopPage" class="page">
    <div class="header">
        <div>
            <h1>كوزمتك تجريبي</h1>
            <p>افضل المنتجات من ماركات عالمية</p>
        </div>
        <button class="cart-icon-btn" onclick="openCartPage()">
            🛒 السلة <span class="cart-badge" id="cartBadgeCount">0</span>
        </button>
    </div>

    <!-- حقل البحث عن منتج -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن منتج بالاسم أو الماركة..." oninput="onSearchInput()">
        <span id="clearSearchBtn" class="clear-search-btn" onclick="clearSearch()">✕</span>
    </div>

    <!-- قائمة الأقسام بالعرض -->
    <div class="categories-bar" id="categoriesBar"></div>

    <!-- شبكة عرض المنتجات -->
    <div id="productsGrid"></div>

    <!-- الفوتر أسفل الصفحة -->
    <div class="footer">
        Designed by Eng. Amjed 07803342472
    </div>
</div>

<!-- ================= صفحة تفاصيل المنتج ================= -->
<div id="productDetailPage" class="page hidden">
    <div class="cart-header">
        <h2>تفاصيل المنتج 📦</h2>
        <button class="btn-back" onclick="openShopPage()">← رجوع</button>
    </div>
    <div id="productDetailContent"></div>
</div>

<!-- ================= صفحة السلة المستقلة ================= -->
<div id="cartPage" class="page hidden">
    <div class="cart-header">
        <h2>سلة الطلبات 🛒</h2>
        <button class="btn-back" onclick="openShopPage()">← رجوع</button>
    </div>

    <div id="cartItemsList"></div>

    <div id="cartSummarySection">
        <!-- حقل كود الخصم (فوق المبلغ الإجمالي) -->
        <div style="background: #1e293b; padding: 12px; border-radius: 10px; margin-top: 15px; border: 1px solid #334155;">
            <label class="form-label">كود الخصم (إن وجد):</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="couponInput" class="form-input" placeholder="أدخل كود الخصم هنا..." style="margin-bottom: 0; text-transform: uppercase;">
                <button type="button" onclick="applyCoupon()" style="background: #0284c7; color: white; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; white-space: nowrap;">تطبيق</button>
            </div>
            <div id="couponStatusMsg" style="font-size: 12px; margin-top: 6px; display: none;"></div>
        </div>

        <div class="total-box" id="cartGrandTotalBox">
            <span>المبلغ الإجمالي:</span>
            <span id="cartGrandTotal" style="color:#22c55e;">0 د.ع</span>
        </div>
        
        <div class="delivery-note">
            🚚 ستضاف إجور التوصيل الى المبلغ الاجمالي
        </div>

        <div class="form-group">
            <label class="form-label">الاسم الكامل:</label>
            <input type="text" id="custName" class="form-input" placeholder="اكتب اسمك هنا...">

            <label class="form-label">رقم الهاتف:</label>
            <input type="text" id="custPhone" class="form-input" placeholder="0780xxxxxxx">

            <label class="form-label">العنوان التفصيلي:</label>
            <input type="text" id="custAddress" class="form-input" placeholder="المدينة / المنطقة / أقرب نقطة دالة">
        </div>

        <button class="btn-send-wa" onclick="sendOrderToWhatsApp()">📲 ارسال الى واتساب المتجر</button>
    </div>
</div>

<script>
    var SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxawmW3P80aNBPdrlYLS3XZsSuUOW6z0XgCvkiudi4RW8N0vTIaxJJB5eoT3vGQ2aiq/exec"; 
    var PHARMACY_WA = "9647803342472";

    var products = [];
    var categories = ["الكل"];
    var activeCategory = "الكل";
    var cart = {};
    var currentDetailId = null;
    var searchQuery = "";

    var appliedCoupon = null;
    var allCoupons = [];

    // --- دوال حفظ واسترجاع السلة من الذاكرة المحلية ---
    function saveCartToStorage() {
        localStorage.setItem('user_cart', JSON.stringify(cart));
    }

    function loadCartFromStorage() {
        var savedCart = localStorage.getItem('user_cart');
        if (savedCart) {
            try {
                cart = JSON.parse(savedCart);
            } catch(e) {
                cart = {};
            }
        }
    }

    function fetchProductsFromSheet() {
        var grid = document.getElementById('productsGrid');
        grid.innerHTML = '<p style="text-align:center; grid-column: 1 / -1; padding:30px; color:#cbd5e1;">جار تحميل المنتجات   ...</p>';

        fetch(SHEET_API_URL)
            .then(function(response) { return response.json(); })
            .then(function(data) {
                products = data;
                
                var catMap = { "الكل": true };
                for (var i = 0; i < products.length; i++) {
                    if (products[i].category) {
                        catMap[products[i].category] = true;
                    }
                }
                categories = Object.keys(catMap);

                renderCategories();
                renderProducts();
            })
            .catch(function(error) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1 / -1; color:#ef4444; padding:20px;">تعذر تحميل المنتجات، تأكد من رابط Google Sheets.</p>';
            });
    }

    function fetchCouponsFromSheet() {
        fetch(SHEET_API_URL + "?action=getCoupons")
            .then(function(response) { return response.json(); })
            .then(function(data) {
                allCoupons = data || [];
            })
            .catch(function(err) {
                console.log("Error fetching coupons:", err);
            });
    }

    async function applyCoupon() {
        var input = document.getElementById("couponInput");
        var msg = document.getElementById("couponStatusMsg");
        if (!input) return;

        var codeVal = input.value.trim().toUpperCase();
        if (!codeVal) {
            appliedCoupon = null;
            msg.style.display = "block";
            msg.style.color = "#ef4444";
            msg.innerText = "يرجى كتابة كود الخصم أولاً";
            renderCartItems();
            return;
        }

        try {
            var res = await fetch(SHEET_API_URL + "?action=getCoupons");
            allCoupons = await res.json();
        } catch(e) {}

        var found = allCoupons.find(c => String(c.code).trim().toUpperCase() === codeVal);

        if (found) {
            appliedCoupon = found;
            msg.style.display = "block";
            msg.style.color = "#4ade80";
            msg.innerText = "✅ تم تطبيق كود الخصم بنجاح (" + found.discount + "%)";
        } else {
            appliedCoupon = null;
            msg.style.display = "block";
            msg.style.color = "#fca5a5";
            msg.innerText = "❌ كود الخصم غير صحيح أو غير فعال";
        }

        renderCartItems();
    }

    function renderCategories() {
        var html = "";
        for (var i = 0; i < categories.length; i++) {
            var cat = categories[i];
            var activeClass = (cat === activeCategory) ? "active" : "";
            html += '<div class="category-tab ' + activeClass + '" onclick="selectCategory(\'' + cat + '\')">' + cat + '</div>';
        }
        document.getElementById('categoriesBar').innerHTML = html;
    }

    function selectCategory(cat) {
        activeCategory = cat;
        renderCategories();
        renderProducts();
    }

    function onSearchInput() {
        var input = document.getElementById('searchInput');
        searchQuery = input.value.trim().toLowerCase();
        
        var clearBtn = document.getElementById('clearSearchBtn');
        if (clearBtn) {
            clearBtn.style.display = input.value.length > 0 ? 'block' : 'none';
        }
        
        renderProducts();
    }

    function clearSearch() {
        var input = document.getElementById('searchInput');
        input.value = '';
        onSearchInput();
        input.focus();
    }

    function renderProducts() {
        var html = "";
        var matchCount = 0;

        for (var i = 0; i < products.length; i++) {
            var p = products[i];

            var matchesCategory = (searchQuery !== "" || activeCategory === "الكل" || p.category === activeCategory);
            
            var pName = (p.name || "").toLowerCase();
            var pBrand = (p.brand || "").toLowerCase();
            var matchesSearch = (searchQuery === "") || (pName.indexOf(searchQuery) !== -1 || pBrand.indexOf(searchQuery) !== -1);

            if (matchesCategory && matchesSearch) {
                matchCount++;
                var qty = cart[p.id] || 0;
                
                var cardImage = (p.images && p.images.length > 0) ? p.images[0] : p.image;
                var imageContent = (cardImage && cardImage.trim().startsWith('http')) 
                    ? '<img src="' + cardImage + '" alt="' + p.name + '" onerror="this.onerror=null; this.parentNode.innerHTML=\'' + p.icon + '\';">'
                    : p.icon;

                html += '<div class="product-card" onclick="openProductDetail(' + p.id + ')">' +
                    '<div class="img-box">' + imageContent + '</div>' +
                    '<div class="product-details">' +
                        '<span class="brand-tag">' + p.brand + '</span>' +
                        '<div class="product-title">' + p.name + '</div>' +
                        '<div class="product-price">' + p.price.toLocaleString() + ' د.ع</div>' +
                    '</div>' +
                    '<div class="qty-controls" onclick="event.stopPropagation()">';

                if (qty > 0) {
                    html += '<button class="btn-qty btn-minus" onclick="changeQty(' + p.id + ', -1)">-</button>' +
                            '<span class="qty-number">' + qty + '</span>' +
                            '<button class="btn-qty btn-plus" style="width:30px;" onclick="changeQty(' + p.id + ', 1)">+</button>';
                } else {
                    html += '<button class="btn-qty btn-plus" onclick="changeQty(' + p.id + ', 1)">+ إضافة للسلة</button>';
                }

                html += '</div></div>';
            }
        }

        if (matchCount === 0 && products.length > 0) {
            html = '<p style="text-align:center; grid-column: 1 / -1; padding:30px; color:#94a3b8;">لا توجد نتائج مطابقة للبحث</p>';
        }

        document.getElementById('productsGrid').innerHTML = html;
        updateBadge();
    }

    function scrollGallery(direction) {
        var box = document.getElementById('detailImgBox');
        if (box) {
            var scrollAmount = box.clientWidth;
            box.scrollBy({ left: direction * scrollAmount * -1, behavior: 'smooth' });
        }
    }

    function openProductDetail(id) {
        var p = getProductById(id);
        if (!p) return;
        currentDetailId = id;

        document.getElementById('shopPage').classList.add('hidden');
        document.getElementById('cartPage').classList.add('hidden');
        document.getElementById('productDetailPage').classList.remove('hidden');

        var imgList = (p.images && p.images.length > 0) ? p.images : ((p.image && p.image.trim().startsWith('http')) ? [p.image] : []);
        var imageContent = "";
        var imageCount = 0;

        if (imgList.length > 0) {
            for (var k = 0; k < imgList.length; k++) {
                if (imgList[k] && imgList[k].trim().startsWith('http')) {
                    imageContent += '<img src="' + imgList[k] + '" alt="' + p.name + '" onerror="this.style.display=\'none\';">';
                    imageCount++;
                }
            }
        }
        if (!imageContent) {
            imageContent = p.icon;
        }

        var description = p.desc || p.description || "منتج عالي الجودة متوفر لدينا.";
        
        var indicatorHtml = "";
        var navButtonsHtml = "";

        if (imageCount > 1) {
            indicatorHtml = '<div class="img-indicator"> اسحب لعرض الصور (' + imageCount + ') </div>';
            navButtonsHtml = '<button class="slider-btn prev" onclick="scrollGallery(1)">❯</button>' +
                             '<button class="slider-btn next" onclick="scrollGallery(-1)">❮</button>';
        }

        var html = '<div class="detail-card">' +
            '<div style="position: relative; margin-bottom: 12px;">' +
                '<div class="detail-img-box" id="detailImgBox">' + imageContent + '</div>' +
                navButtonsHtml +
                indicatorHtml +
            '</div>' +
            '<span class="brand-tag">' + p.brand + '</span>' +
            '<h2 style="color:#fff; margin:8px 0;">' + p.name + '</h2>' +
            '<div style="color:#38bdf8; font-size:18px; font-weight:bold;">' + p.price.toLocaleString() + ' د.ع</div>' +
            '<div class="detail-desc-box">' +
                '<h3>تفاصيل ومعلومات المنتج:</h3>' +
                '<p>' + description + '</p>' +
            '</div>' +
            '<div id="detailQtyBox"></div>' +
        '</div>';

        document.getElementById('productDetailContent').innerHTML = html;
        renderDetailQtyControls(p.id);
    }

    function renderDetailQtyControls(id) {
        var qty = cart[id] || 0;
        var box = document.getElementById('detailQtyBox');
        if (!box) return;

        var html = '<div class="qty-controls" style="padding: 8px 12px;">';
        if (qty > 0) {
            html += '<button class="btn-qty btn-minus" style="width:40px; height:40px; font-size:20px;" onclick="changeQty(' + id + ', -1)">-</button>' +
                    '<span class="qty-number" style="font-size:18px;">' + qty + '</span>' +
                    '<button class="btn-qty btn-plus" style="width:40px; height:40px; font-size:20px;" onclick="changeQty(' + id + ', 1)">+</button>';
        } else {
            html += '<button class="btn-qty btn-plus" style="height:40px; font-size:15px;" onclick="changeQty(' + id + ', 1)">+ إضافة للسلة</button>';
        }
        html += '</div>';
        box.innerHTML = html;
    }

    function changeQty(id, delta) {
        var currentQty = cart[id] || 0;
        var newQty = currentQty + delta;

        if (newQty <= 0) {
            delete cart[id];
        } else {
            cart[id] = newQty;
        }

        saveCartToStorage();

        renderProducts();
        
        if (!document.getElementById('productDetailPage').classList.contains('hidden') && currentDetailId === id) {
            renderDetailQtyControls(id);
        }

        if (!document.getElementById('cartPage').classList.contains('hidden')) {
            renderCartItems();
        }
    }

    function updateBadge() {
        var totalItems = 0;
        for (var id in cart) { totalItems += cart[id]; }
        document.getElementById('cartBadgeCount').innerText = totalItems;
    }

    function openCartPage() {
        document.getElementById('shopPage').classList.add('hidden');
        document.getElementById('productDetailPage').classList.add('hidden');
        document.getElementById('cartPage').classList.remove('hidden');

        document.getElementById('custName').value = localStorage.getItem('cust_name') || '';
        document.getElementById('custPhone').value = localStorage.getItem('cust_phone') || '';
        document.getElementById('custAddress').value = localStorage.getItem('cust_address') || '';

        fetchCouponsFromSheet();
        renderCartItems();
    }

    function openShopPage() {
        document.getElementById('cartPage').classList.add('hidden');
        document.getElementById('productDetailPage').classList.add('hidden');
        document.getElementById('shopPage').classList.remove('hidden');
        renderProducts();
    }

    function renderCartItems() {
        var listContainer = document.getElementById('cartItemsList');
        var html = "";
        var subTotal = 0;
        var itemCount = 0;

        for (var id in cart) {
            var qty = cart[id];
            var p = getProductById(id);
            if (p) {
                itemCount++;
                var itemTotal = p.price * qty;
                subTotal += itemTotal;

                html += '<div class="cart-item">' +
                    '<div>' +
                        '<div class="cart-item-title">' + p.name + '</div>' +
                        '<div class="cart-item-price">' + p.price.toLocaleString() + ' د.ع × ' + qty + ' = ' + itemTotal.toLocaleString() + ' د.ع</div>' +
                    '</div>' +
                    '<div class="qty-controls">' +
                        '<button class="btn-qty btn-minus" onclick="changeQty(' + p.id + ', -1)">-</button>' +
                        '<span class="qty-number">' + qty + '</span>' +
                        '<button class="btn-qty btn-plus" style="width:30px;" onclick="changeQty(' + p.id + ', 1)">+</button>' +
                    '</div>' +
                '</div>';
            }
        }

        if (itemCount === 0) {
            listContainer.innerHTML = '<p style="text-align:center; padding:30px; color:#94a3b8;">السلة فارغة حالياً</p>';
            document.getElementById('cartSummarySection').style.display = 'none';
            appliedCoupon = null;
            var couponInput = document.getElementById("couponInput");
            if (couponInput) couponInput.value = "";
            var couponStatusMsg = document.getElementById("couponStatusMsg");
            if (couponStatusMsg) couponStatusMsg.style.display = "none";
        } else {
            listContainer.innerHTML = html;
            document.getElementById('cartSummarySection').style.display = 'block';

            var discountAmount = 0;
            if (appliedCoupon && appliedCoupon.discount) {
                discountAmount = Math.round((subTotal * appliedCoupon.discount) / 100);
            }
            var finalTotal = subTotal - discountAmount;

            var totalBox = document.getElementById('cartGrandTotalBox');
            if (totalBox) {
                if (discountAmount > 0) {
                    totalBox.innerHTML = '<span>المبلغ الإجمالي:</span>' +
                        '<div style="text-align:left;">' +
                            '<span style="text-decoration:line-through; color:#94a3b8; font-size:12px; margin-left:6px;">' + subTotal.toLocaleString() + ' د.ع</span>' +
                            '<span style="color:#22c55e;">' + finalTotal.toLocaleString() + ' د.ع</span>' +
                            '<div style="font-size:11px; color:#38bdf8; font-weight:normal;">(خصم ' + appliedCoupon.discount + '%: -' + discountAmount.toLocaleString() + ' د.ع)</div>' +
                        '</div>';
                } else {
                    totalBox.innerHTML = '<span>المبلغ الإجمالي:</span>' +
                        '<span style="color:#22c55e;">' + subTotal.toLocaleString() + ' د.ع</span>';
                }
            }
        }
    }

    function getProductById(id) {
        for (var i = 0; i < products.length; i++) {
            if (products[i].id == id) return products[i];
        }
        return null;
    }

    function sendOrderToWhatsApp() {
        var name = document.getElementById('custName').value.trim();
        var phone = document.getElementById('custPhone').value.trim();
        var address = document.getElementById('custAddress').value.trim();

        if (Object.keys(cart).length === 0) {
            alert('السلة فارغة!');
            return;
        }
        if (!name || !phone || !address) {
            alert('يرجى ملء جميع الحقول');
            return;
        }

        localStorage.setItem('cust_name', name);
        localStorage.setItem('cust_phone', phone);
        localStorage.setItem('cust_address', address);

        var msg = "*طلب جديد من المتجر 🩺*\n\n";
        msg += "*الاسم:* " + name + "\n";
        msg += "*رقم الهاتف:* " + phone + "\n";
        msg += "*العنوان:* " + address + "\n";
        msg += "------------------------\n*المنتجات المختارة:*\n";

        var subTotal = 0;
        for (var id in cart) {
            var p = getProductById(id);
            if (p) {
                var itemTotal = p.price * cart[id];
                subTotal += itemTotal;
                msg += "• " + p.name + " (" + cart[id] + "x) = " + itemTotal.toLocaleString() + " د.ع\n";
            }
        }

        var discountAmount = 0;
        if (appliedCoupon && appliedCoupon.discount) {
            discountAmount = Math.round((subTotal * appliedCoupon.discount) / 100);
            var finalTotal = subTotal - discountAmount;
            msg += "------------------------\n";
            msg += "*المجموع:* " + subTotal.toLocaleString() + " د.ع\n";
            msg += "*كود الخصم:* " + appliedCoupon.code + " (" + appliedCoupon.discount + "%)\n";
            msg += "*قيمة الخصم:* -" + discountAmount.toLocaleString() + " د.ع\n";
            msg += "*الإجمالي الكلي بعد الخصم:* " + finalTotal.toLocaleString() + " د.ع";
        } else {
            msg += "------------------------\n*الإجمالي الكلي:* " + subTotal.toLocaleString() + " د.ع";
        }

        window.open("https://wa.me/" + PHARMACY_WA + "?text=" + encodeURIComponent(msg), '_blank');
    }

    loadCartFromStorage();
    fetchProductsFromSheet();
    fetchCouponsFromSheet();
</script>
